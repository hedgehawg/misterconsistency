name: track-package
on:
  workflow_dispatch:
    inputs:
      tracking:
        description: 'FedEx tracking number'
        required: true
        default: '383405348169'

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: AfterShip static fetch
        continue-on-error: true
        run: |
          curl -sL "https://bizon.aftership.com/${{ inputs.tracking }}" -o aftership.html || true
          echo "===AFTERSHIP BYTES==="; wc -c aftership.html || true
          echo "===AFTERSHIP STATE==="
          grep -oE '(INITIAL_STATE|checkpoint|delivered|in_transit|out_for_delivery)[^<]{0,400}' aftership.html | head -40 || true

      - name: FedEx via headless browser
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.js << 'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch({ args: ['--no-sandbox'] });
            const p = await (await b.newContext({ userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36' })).newPage();
            await p.goto('https://www.fedex.com/fedextrack/?trknbr=' + process.env.TRK, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await p.waitForTimeout(15000);
            const t = await p.evaluate(() => document.body.innerText);
            console.log('===FEDEX PAGE TEXT===');
            console.log(t.slice(0, 8000));
            await b.close();
          })().catch(e => { console.error('FEDEX ERR:', e.message); });
          EOF
          TRK="${{ inputs.tracking }}" node t.js
