<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gattman's World — restaurant reviews mapped</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<style>
  :root {
    --bg: #0e0f12;
    --bg-raised: #16171c;
    --line: #26272e;
    --text: #e8e6e1;
    --text-dim: #9a978f;
    --gold: #d0a44c;
    --serif: "Fraunces", Georgia, serif;
    --sans: "Inter", -apple-system, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body, #map { height: 100%; background: var(--bg); font-family: var(--sans); }
  .leaflet-container { background: var(--bg); font-family: var(--sans); }

  .face-marker { filter: drop-shadow(0 1px 3px rgba(0,0,0,.65)); }

  .gm-cluster { display: flex; align-items: center; justify-content: center;
    background: rgba(22,23,28,.92); color: var(--gold);
    border: 1.5px solid var(--gold); border-radius: 50%;
    font: 600 12px/1 var(--sans); box-shadow: 0 1px 4px rgba(0,0,0,.5); }

  .leaflet-popup-content-wrapper { background: var(--bg-raised); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.55); }
  .leaflet-popup-tip { background: var(--bg-raised); border: 1px solid var(--line); }
  .leaflet-popup-content { margin: 14px 16px; line-height: 1.5; font-size: 13px; }
  .leaflet-popup-close-button { color: var(--text-dim) !important; }
  .gm-name { font-family: var(--serif); font-size: 1.05rem; font-weight: 600; margin-right: 8px; }
  .gm-status { font-size: .72rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
  .gm-status.yes { color: var(--gold); }
  .gm-status.skip { color: var(--text-dim); }
  .gm-status.closed { color: #c96f65; }
  .gm-meta { color: var(--text-dim); font-size: .8rem; margin-top: 2px; }
  .gm-thoughts { margin-top: 8px; }
  .gm-addr { color: var(--text-dim); font-size: .75rem; margin-top: 8px; }

  .leaflet-bar a { background: var(--bg-raised); color: var(--text); border-bottom: 1px solid var(--line); }
  .leaflet-bar a:hover { background: #1d1e24; color: var(--gold); }
  .leaflet-bar { border: 1px solid var(--line); box-shadow: 0 1px 4px rgba(0,0,0,.5); }
  .leaflet-control-attribution { background: rgba(14,15,18,.75); color: var(--text-dim); font-size: 10px; }
  .leaflet-control-attribution a { color: var(--text-dim); }

  /* theme toggle (top right) */
  .gm-toggle { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,.5); }
  .gm-toggle button { font: 500 12px/1 var(--sans); padding: 7px 12px; cursor: pointer;
    background: var(--bg-raised); color: var(--text-dim); border: 0; }
  .gm-toggle button + button { border-left: 1px solid var(--line); }
  .gm-toggle button.on { color: var(--gold); }
  .gm-toggle button:hover:not(.on) { color: var(--text); }

  /* search (top left, under the zoom control) */
  .gm-search { position: relative; width: 250px; }
  .gm-search input { width: 100%; font: 500 13px/1.2 var(--sans); color: var(--text);
    background: var(--bg-raised); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 30px 8px 12px; outline: none; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
  .gm-search input::placeholder { color: var(--text-dim); }
  .gm-search input::-webkit-search-cancel-button { -webkit-appearance: none; }
  .gm-search input:focus { border-color: var(--gold); }
  .gm-search-clear { position: absolute; top: 0; right: 0; width: 30px; height: 32px;
    display: none; align-items: center; justify-content: center; cursor: pointer;
    background: none; border: 0; color: var(--text-dim); font: 400 15px/1 var(--sans); }
  .gm-search.has-text .gm-search-clear { display: flex; }
  .gm-search-clear:hover { color: var(--text); }
  .gm-search-list { list-style: none; margin-top: 6px; max-height: 320px; overflow-y: auto;
    background: var(--bg-raised); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 6px 24px rgba(0,0,0,.55); display: none; }
  .gm-search.open .gm-search-list { display: block; }
  .gm-search-list li { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .gm-search-list li:last-child { border-bottom: 0; }
  .gm-search-list li.active, .gm-search-list li:hover { background: rgba(208,164,76,.12); }
  .gm-search-list .gm-sr-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .gm-search-list .gm-sr-name { font: 600 13px/1.3 var(--sans); color: var(--text); }
  .gm-search-list .gm-sr-sub { color: var(--text-dim); font: 400 11px/1.3 var(--sans); margin-top: 1px; }
  .gm-search-list .gm-sr-none { color: var(--text-dim); font: 400 12px/1.3 var(--sans); cursor: default; }
  .gm-search-list .gm-sr-none:hover { background: none; }
  .gm-search-list .gm-sr-head { padding: 7px 12px 3px; font: 600 10px/1 var(--sans);
    letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim);
    cursor: default; border-bottom: 0; }
  .gm-search-list .gm-sr-head:hover { background: none; }
  .gm-sr-count { color: var(--text-dim); font: 500 11px/1.3 var(--sans); white-space: nowrap; }
  .gm-chip { display: none; margin-top: 6px; align-items: center; gap: 8px;
    background: var(--bg-raised); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 10px; font: 500 12px/1.3 var(--sans); color: var(--text);
    box-shadow: 0 1px 4px rgba(0,0,0,.5); }
  .gm-search.filtered .gm-chip { display: flex; }
  .gm-chip b { color: var(--gold); font-weight: 600; }
  .gm-chip-x { margin-left: auto; background: none; border: 0; cursor: pointer;
    color: var(--text-dim); font: 400 14px/1 var(--sans); padding: 0 0 0 6px; }
  .gm-chip-x:hover { color: var(--text); }
  @media (max-width: 480px) { .gm-search { width: 186px; } }
  @media (pointer: coarse) { .gm-search input { font-size: 16px; } }

  /* classic mode: original light map colors, conventional UI */
  body.classic { --bg: #e8e6e3; --bg-raised: #ffffff; --line: #d5d2cb;
    --text: #202124; --text-dim: #5f6368; --gold: #1a73e8; }
  body.classic .gm-status.yes { color: #188038; }
  body.classic .gm-status.closed { color: #c5221f; }
  body.classic .leaflet-bar a:hover { background: #f3f1ee; color: var(--text); }
  body.classic .leaflet-popup-content-wrapper, body.classic .leaflet-popup-tip { box-shadow: 0 4px 16px rgba(60,56,45,.28); }
  body.classic .leaflet-control-attribution { background: rgba(255,255,255,.75); }
  body.classic .gm-toggle button.on { color: #1a73e8; }
  body.classic .gm-search-list li.active, body.classic .gm-search-list li:hover { background: rgba(26,115,232,.10); }
</style>
</head>
<body>
<div id="map" role="application" aria-label="Map of Jon Gattman's restaurant reviews"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="gattman-data.js?v=3"></script>
<script>
(function () {
  const map = L.map('map', { center: [24, 8], zoom: 2, minZoom: 2, worldCopyJump: true });
  const TILES = {
    noir: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: 'abcd', maxZoom: 19
    }),
    classic: L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
      attribution: 'Map data &copy; Google',
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3'], maxZoom: 19
    })
  };

  let theme;
  function setTheme(t) {
    if (t === theme) return;
    if (theme) map.removeLayer(TILES[theme]);
    theme = t;
    TILES[t].addTo(map);
    // noir clusters the pins; classic shows every face individually, like the original My Maps
    if (t === 'classic') { map.removeLayer(cluster); flat.addTo(map); }
    else { map.removeLayer(flat); cluster.addTo(map); }
    document.body.classList.toggle('classic', t === 'classic');
    document.querySelectorAll('.gm-toggle button').forEach(b =>
      b.classList.toggle('on', b.dataset.theme === t));
    try { localStorage.setItem('gattman-theme', t); } catch (e) {}
  }

  const Toggle = L.Control.extend({
    options: { position: 'topright' },
    onAdd: function () {
      const div = L.DomUtil.create('div', 'gm-toggle leaflet-control');
      div.innerHTML = '<button type="button" data-theme="noir">Noir</button>' +
                      '<button type="button" data-theme="classic">Classic</button>';
      L.DomEvent.disableClickPropagation(div);
      div.addEventListener('click', e => {
        if (e.target.dataset.theme) setTheme(e.target.dataset.theme);
      });
      return div;
    }
  });
  map.addControl(new Toggle());

  // faces: source pngs are 112px tall (2x) so they render crisp at ~42px
  const ICONS = {
    yes:    L.icon({ iconUrl: 'gattman-icons/yes.png',    iconSize: [35, 42], iconAnchor: [17, 21], popupAnchor: [0, -20], className: 'face-marker' }),
    skip:   L.icon({ iconUrl: 'gattman-icons/skip.png',   iconSize: [33, 42], iconAnchor: [16, 21], popupAnchor: [0, -20], className: 'face-marker' }),
    closed: L.icon({ iconUrl: 'gattman-icons/closed.png', iconSize: [39, 42], iconAnchor: [19, 21], popupAnchor: [0, -20], className: 'face-marker' })
  };
  const STATUS_LABEL = { yes: 'Yes', skip: 'Skip', closed: 'Now closed' };

  const esc = s => String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function popupHtml(r) {
    let h = '<span class="gm-name">' + esc(r.n) + '</span>' +
            '<span class="gm-status ' + r.s + '">' + STATUS_LABEL[r.s] + '</span>';
    const meta = [r.g, r.t].filter(Boolean).map(esc).join(' · ');
    if (meta) h += '<div class="gm-meta">' + meta + '</div>';
    if (r.th) h += '<div class="gm-thoughts">' + esc(r.th) + '</div>';
    if (r.v) h += '<div class="gm-meta">Most recently visited: ' + esc(r.v) + '</div>';
    if (r.a) h += '<div class="gm-addr">' + esc(r.a) + '</div>';
    return h;
  }

  const cluster = L.markerClusterGroup({
    maxClusterRadius: 44,
    showCoverageOnHover: false,
    iconCreateFunction: c => {
      const n = c.getChildCount();
      const d = n < 10 ? 30 : n < 100 ? 36 : 44;
      return L.divIcon({ html: '<div class="gm-cluster" style="width:' + d + 'px;height:' + d + 'px">' + n + '</div>',
                         className: '', iconSize: [d, d] });
    }
  });

  // separate marker instances per container so markercluster's bookkeeping
  // never fights the flat layer when the theme flips back and forth
  const makeMarker = (r, opts) =>
    L.marker(r.c, Object.assign({ icon: ICONS[r.s], title: r.n }, opts))
      .bindPopup(popupHtml(r), { maxWidth: 300, autoPanPadding: L.point(60, 24) });
  const data = window.GATTMAN || [];
  const cMarkers = data.map(r => makeMarker(r));
  const fMarkers = data.map(r => makeMarker(r, { riseOnHover: true }));
  cluster.addLayers(cMarkers);
  const flat = L.layerGroup(fMarkers);

  // structured search (top left): recognizes places and cuisines as well as
  // names. Picking a group filters the map to it (chip to clear); picking a
  // restaurant jumps to it. Multi-word queries narrow across all fields.
  const fold = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  // short tokens (tx, al, ny) match whole words only; longer ones match anywhere
  const tokMatch = (hay, t) => t.length <= 2
    ? new RegExp('\\b' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b').test(hay)
    : hay.includes(t);
  // query-time synonyms + light plural stripping: barbecue finds BBQ, tacos finds taco
  const SYN = [['bbq', 'barbecue', 'barbeque'], ['burger', 'hamburger'], ['donut', 'doughnut'],
               ['whiskey', 'whisky']];
  const variants = t => {
    const v = new Set([t]);
    if (t.length > 3 && t.endsWith('s')) v.add(t.slice(0, -1));
    SYN.forEach(g => { if ([...v].some(x => g.indexOf(x) >= 0)) g.forEach(w => v.add(w)); });
    return [...v];
  };
  const tokHit = (hay, t) => variants(t).some(x => tokMatch(hay, x));

  const US_STATES = { AK: 'Alaska', AL: 'Alabama', AR: 'Arkansas', CA: 'California', CO: 'Colorado',
    FL: 'Florida', GA: 'Georgia', HI: 'Hawaii', IL: 'Illinois', KY: 'Kentucky', LA: 'Louisiana',
    MA: 'Massachusetts', MT: 'Montana', NC: 'North Carolina', NM: 'New Mexico', NV: 'Nevada',
    NY: 'New York', OH: 'Ohio', OR: 'Oregon', PA: 'Pennsylvania', SC: 'South Carolina',
    TN: 'Tennessee', TX: 'Texas', UT: 'Utah', WY: 'Wyoming' };
  // sheet tab -> [city (null = the tab is a region), region (US abbr or name), country
  // (omitted = United States when region is a US abbr)]
  const GEO = {
    'Alaska': [null, 'AK'], 'Albuquerque': ['Albuquerque', 'NM'], 'Anguilla': [null, null, 'Anguilla'],
    'Aspen': ['Aspen', 'CO'], 'Athens,Gr': ['Athens', null, 'Greece'], 'Austin': ['Austin', 'TX'],
    'Bangkok': ['Bangkok', null, 'Thailand'], 'Barcelona': ['Barcelona', null, 'Spain'],
    'Bentonville': ['Bentonville', 'AR'], 'Berlin': ['Berlin', null, 'Germany'],
    'Bermuda': [null, null, 'Bermuda'], 'Birmingham': ['Birmingham', 'AL'], 'Boston': ['Boston', 'MA'],
    'Breckinridge': ['Breckenridge', 'CO'], 'Brisbane': ['Brisbane', null, 'Australia'],
    'Bucharest': ['Bucharest', null, 'Romania'], 'Budapest': ['Budapest', null, 'Hungary'],
    'Buenos Aires': ['Buenos Aires', null, 'Argentina'], 'Cabo San Lucas': ['Cabo San Lucas', null, 'Mexico'],
    'Cancun': ['Cancun', null, 'Mexico'], 'Chapel Hill': ['Chapel Hill', 'NC'],
    'Charleston': ['Charleston', 'SC'], 'Chicago': ['Chicago', 'IL'], 'Cincinnati': ['Cincinnati', 'OH'],
    'Copenhagen': ['Copenhagen', null, 'Denmark'], 'Dallas': ['Dallas', 'TX'], 'Denver': ['Denver', 'CO'],
    'Dubrovnik, Cr': ['Dubrovnik', null, 'Croatia'], 'French Polynesia': [null, null, 'French Polynesia'],
    'Hamptons': ['Hamptons', 'NY'], 'Hong Kong': ['Hong Kong', null, 'Hong Kong'],
    'Houston': ['Houston', 'TX'], 'Ibiza': ['Ibiza', null, 'Spain'], 'Ireland': [null, null, 'Ireland'],
    'Italy': [null, null, 'Italy'], 'Jackson Hole': ['Jackson Hole', 'WY'], 'Kyoto': ['Kyoto', null, 'Japan'],
    'La Ventana, MX': ['La Ventana', null, 'Mexico'], 'Las Vegas': ['Las Vegas', 'NV'],
    'London': ['London', 'England', 'United Kingdom'], 'Los Angeles': ['Los Angeles', 'CA'],
    'Louisville': ['Louisville', 'KY'], 'Mallorca': ['Mallorca', null, 'Spain'], 'Maui': ['Maui', 'HI'],
    'Memphis': ['Memphis', 'TN'], 'Mendoza': ['Mendoza', null, 'Argentina'],
    'Merida, Mx': ['Merida', null, 'Mexico'], 'Mexico City': ['Mexico City', null, 'Mexico'],
    'Miami': ['Miami', 'FL'], 'Montana': [null, 'MT'], 'Montreal': ['Montreal', 'Quebec', 'Canada'],
    'Morocco': [null, null, 'Morocco'], 'Munich': ['Munich', null, 'Germany'],
    'Mykonos, GR': ['Mykonos', null, 'Greece'], 'NYC': ['New York City', 'NY'],
    'Nagano Area': [null, 'Nagano', 'Japan'], 'Nashville': ['Nashville', 'TN'],
    'New Orleans': ['New Orleans', 'LA'], 'Norway': [null, null, 'Norway'], 'Oregon': [null, 'OR'],
    'Palm Beach': ['Palm Beach', 'FL'], 'Paris': ['Paris', null, 'France'], 'Park City': ['Park City', 'UT'],
    'Philadelphia': ['Philadelphia', 'PA'], 'Quebec City': ['Quebec City', 'Quebec', 'Canada'],
    'Rome': ['Rome', null, 'Italy'], 'SLC': ['Salt Lake City', 'UT'], 'San Diego': ['San Diego', 'CA'],
    'San Francisco': ['San Francisco', 'CA'], 'San Sebastian & Area': ['San Sebastian', null, 'Spain'],
    'Santa Barbara': ['Santa Barbara', 'CA'], 'Sante Fe': ['Santa Fe', 'NM'],
    'Santorini, Gr': ['Santorini', null, 'Greece'], 'Savannah': ['Savannah', 'GA'],
    'Scotland': [null, 'Scotland', 'United Kingdom'], 'Split, Cr': ['Split', null, 'Croatia'],
    'St Augustine': ['St. Augustine', 'FL'], 'St. Barths': [null, null, 'St. Barths'],
    'Sydney': ['Sydney', null, 'Australia'], 'Tokyo': ['Tokyo', null, 'Japan'],
    'Tulum': ['Tulum', null, 'Mexico'], 'Tuscaloosa': ['Tuscaloosa', 'AL'], 'Vail': ['Vail', 'CO'],
    'Vietnam': [null, null, 'Vietnam'] };
  // sub-city fixups: [display name, unused, country override]
  const SUBCITY = { 'Guethary, Fr': ['Guethary', null, 'France'], 'San Seb': ['San Sebastian'],
    'Sapa': ['Sa Pa'] };
  const EXTRA_HAY = { 'New York City': 'nyc manhattan brooklyn', 'New York': 'ny nyc',
    'Salt Lake City': 'slc', 'United States': 'usa america us', 'United Kingdom': 'uk britain',
    'St. Barths': 'saint barthelemy st barts caribbean', 'Santa Fe': 'sante fe',
    'Breckenridge': 'breckinridge', 'New Orleans': 'nola', 'Mexico City': 'cdmx',
    'Hamptons': 'southampton montauk' };
  const COUNTRY_SHORT = { 'United Kingdom': 'UK', 'United States': 'US' };
  const xtra = s => (s && EXTRA_HAY[s]) || '';

  function geoFor(r) {
    const parts = (r.g || '').split(' \u00b7 ');
    const tab = GEO[parts[0]] || [parts[0], null, null];
    let city = parts[1] || tab[0];
    const region = tab[1];
    let country = tab[2] || (region && US_STATES[region] ? 'United States' : null);
    const fix = city && SUBCITY[city];
    if (fix) { city = fix[0]; if (fix[2]) country = fix[2]; }
    const regionFull = region ? (US_STATES[region] || region) : null;
    const regionAbbr = region && US_STATES[region] ? region : null;
    return { city, regionFull, regionAbbr, country };
  }

  const placeNodes = new Map(), cuisineNodes = new Map();
  const addNode = (m, key, label, hayTerms, it) => {
    if (!m.has(key)) m.set(key, { label, hay: fold(hayTerms.filter(Boolean).join(' ')), items: [] });
    m.get(key).items.push(it);
  };
  const CSTOP = { and: 1, the: 1, with: 1, food: 1, menu: 1, new: 1, style: 1, place: 1 };

  const index = data.map((r, i) => {
    const geo = geoFor(r);
    const geoTerms = [geo.city, xtra(geo.city), geo.regionFull, xtra(geo.regionFull),
                      geo.regionAbbr, geo.country, xtra(geo.country)];
    const it = { r, cM: cMarkers[i], fM: fMarkers[i], name: fold(r.n),
      hay: fold([r.n, r.g, r.t, STATUS_LABEL[r.s]].concat(geoTerms).filter(Boolean).join(' ')) };
    if (geo.city) {
      const suffix = geo.country === 'United States'
        ? (geo.regionAbbr ? ', ' + geo.regionAbbr : '')
        : (geo.country && geo.city !== geo.country ? ', ' + (COUNTRY_SHORT[geo.country] || geo.country) : '');
      addNode(placeNodes, 'city|' + fold(geo.city + '|' + (geo.country || '')),
        geo.city + suffix, [geo.city, xtra(geo.city), geo.regionFull, geo.regionAbbr, geo.country, xtra(geo.country)], it);
    }
    if (geo.regionFull && geo.regionFull !== geo.city)
      addNode(placeNodes, 'reg|' + fold(geo.regionFull),
        geo.regionFull, [geo.regionFull, xtra(geo.regionFull), geo.regionAbbr, geo.country, xtra(geo.country)], it);
    if (geo.country && geo.country !== geo.city)
      addNode(placeNodes, 'cc|' + fold(geo.country),
        geo.country, [geo.country, xtra(geo.country)], it);
    fold(r.t || '').split(/[^a-z]+/).forEach(w => {
      if (w.length < 3 || CSTOP[w]) return;
      // singular/plural collapse into one node (taco + tacos); label = most common form
      const stem = w.length > 3 && w.endsWith('s') ? w.slice(0, -1) : w;
      addNode(cuisineNodes, 'cui|' + stem, '', [stem, stem + 's'], it);
      const node = cuisineNodes.get('cui|' + stem);
      node.forms = node.forms || {};
      node.forms[w] = (node.forms[w] || 0) + 1;
    });
    return it;
  });
  // dedupe cuisine items (a record like "pizza, pizzas" shouldn't count twice)
  cuisineNodes.forEach(n => {
    n.items = [...new Set(n.items)];
    const w = Object.keys(n.forms).sort((a, b) => n.forms[b] - n.forms[a])[0];
    n.label = w === 'bbq' ? 'BBQ' : w.charAt(0).toUpperCase() + w.slice(1);
  });
  const PLACES = [...placeNodes.values()], CUISINES = [...cuisineNodes.values()];

  let filtered = null;   // Set of index items shown on the map, or null for all
  function rebuild() {
    const items = filtered ? index.filter(it => filtered.has(it)) : index;
    cluster.clearLayers(); cluster.addLayers(items.map(it => it.cM));
    flat.clearLayers(); items.forEach(it => flat.addLayer(it.fM));
  }
  function fitTo(items) {
    map.fitBounds(L.latLngBounds(items.map(it => it.r.c)), { padding: [40, 40], maxZoom: 15 });
  }

  function goTo(item) {
    if (filtered && !filtered.has(item)) { filtered = null; rebuild(); }
    map.setView(item.r.c, Math.max(map.getZoom(), 16), { animate: false });
    if (map.hasLayer(cluster)) cluster.zoomToShowLayer(item.cM, () => item.cM.openPopup());
    else item.fM.openPopup();
  }

  const Search = L.Control.extend({
    options: { position: 'topleft' },
    onAdd: function () {
      const div = L.DomUtil.create('div', 'gm-search leaflet-control');
      div.innerHTML = '<input type="search" placeholder="Search ' + data.length + ' spots…" ' +
                      'autocomplete="off" spellcheck="false" aria-label="Search restaurants, places, cuisines">' +
                      '<button type="button" class="gm-search-clear" aria-label="Clear search">×</button>' +
                      '<ul class="gm-search-list" role="listbox"></ul>' +
                      '<div class="gm-chip"><span class="gm-chip-label"></span>' +
                      '<button type="button" class="gm-chip-x" aria-label="Clear filter">×</button></div>';
      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.disableScrollPropagation(div);

      const input = div.querySelector('input');
      const clear = div.querySelector('.gm-search-clear');
      const list = div.querySelector('ul');
      const chipLabel = div.querySelector('.gm-chip-label');
      let rows = [], active = -1;   // rows: {kind:'head'|'all'|'grp'|'rest', ...}

      function applyFilter(items, label) {
        filtered = new Set(items);
        rebuild();
        fitTo(items);
        chipLabel.innerHTML = '<b>' + items.length + '</b>&nbsp;' + esc(label);
        div.classList.add('filtered');
        div.classList.remove('open');
      }
      function clearFilter() {
        filtered = null;
        rebuild();
        div.classList.remove('filtered');
      }

      function render() {
        list.innerHTML = '';
        if (!rows.length) {
          if (input.value.trim().length >= 2)
            list.innerHTML = '<li class="gm-sr-none">No spots match</li>';
          div.classList.toggle('open', !!list.innerHTML);
          return;
        }
        rows.forEach((row, i) => {
          const li = document.createElement('li');
          if (row.kind === 'head') {
            li.className = 'gm-sr-head';
            li.textContent = row.label;
          } else {
            li.setAttribute('role', 'option');
            if (i === active) li.classList.add('active');
            if (row.kind === 'rest') {
              li.innerHTML = '<div class="gm-sr-top"><span class="gm-sr-name">' + esc(row.item.r.n) + '</span>' +
                             '<span class="gm-status ' + row.item.r.s + '">' + STATUS_LABEL[row.item.r.s] + '</span></div>' +
                             '<div class="gm-sr-sub">' + esc([row.item.r.g, row.item.r.t].filter(Boolean).join(' · ')) + '</div>';
            } else {
              const count = row.kind === 'grp'
                ? '<span class="gm-sr-count">' + row.items.length + (row.items.length === 1 ? ' spot' : ' spots') + '</span>'
                : '';
              li.innerHTML = '<div class="gm-sr-top"><span class="gm-sr-name">' + esc(row.label) + '</span>' + count + '</div>';
            }
            li.addEventListener('click', () => pick(row));
          }
          list.appendChild(li);
        });
        div.classList.add('open');
      }

      function search() {
        const q = input.value.trim();
        const toks = fold(q).split(/\s+/).filter(Boolean);
        div.classList.toggle('has-text', !!input.value);
        active = -1;
        rows = [];
        if (fold(q).length < 2) { render(); return; }
        const matched = index.filter(it => toks.every(t => tokHit(it.hay, t)));
        const places = PLACES.filter(p => toks.every(t => tokHit(p.hay, t)))
          .sort((a, b) => b.items.length - a.items.length).slice(0, 6);
        const cuisines = CUISINES.filter(c => c.items.length >= 2 && toks.every(t => tokHit(c.hay, t)))
          .sort((a, b) => b.items.length - a.items.length).slice(0, 3);
        const fq = toks.join(' ');
        const starts = [], contains = [], other = [];
        matched.forEach(it => {
          if (it.name.startsWith(fq)) starts.push(it);
          else if (it.name.includes(fq)) contains.push(it);
          else other.push(it);
        });
        const rests = starts.concat(contains, other).slice(0, 8);
        if (matched.length > 1)
          rows.push({ kind: 'all', items: matched, label: 'Show all ' + matched.length + ' on the map' });
        if (places.length) {
          rows.push({ kind: 'head', label: 'Places' });
          places.forEach(p => rows.push({ kind: 'grp', items: p.items, label: p.label }));
        }
        if (cuisines.length) {
          rows.push({ kind: 'head', label: 'Cuisines' });
          cuisines.forEach(c => rows.push({ kind: 'grp', items: c.items, label: c.label }));
        }
        if (rests.length) {
          rows.push({ kind: 'head', label: 'Restaurants' });
          rests.forEach(it => rows.push({ kind: 'rest', item: it }));
        }
        render();
      }

      function pick(row) {
        if (row.kind === 'rest') {
          input.value = row.item.r.n;
          div.classList.remove('open');
          goTo(row.item);
        } else {
          applyFilter(row.items, row.kind === 'all' ? input.value.trim() : row.label);
        }
      }

      function reset() {
        input.value = '';
        rows = []; active = -1;
        div.classList.remove('open', 'has-text');
        list.innerHTML = '';
      }

      const step = dir => {
        if (!rows.length) return;
        let i = active;
        do { i = (i + dir + rows.length) % rows.length; } while (rows[i].kind === 'head');
        active = i;
        render();
      };
      input.addEventListener('input', search);
      clear.addEventListener('click', () => { reset(); input.focus(); });
      div.querySelector('.gm-chip-x').addEventListener('click', clearFilter);
      input.addEventListener('keydown', e => {
        if (e.key === 'ArrowDown') { e.preventDefault(); step(1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); step(-1); }
        else if (e.key === 'Enter') {
          e.preventDefault();
          if (!rows.length) return;
          if (active >= 0) { pick(rows[active]); return; }
          const first = rows.find(r => r.kind !== 'head');
          if (first) pick(first);
        }
        else if (e.key === 'Escape') { reset(); input.blur(); }
      });
      document.addEventListener('click', e => { if (!div.contains(e.target)) div.classList.remove('open'); });
      return div;
    }
  });
  map.addControl(new Search());

  let saved = null;
  try { saved = localStorage.getItem('gattman-theme'); } catch (e) {}
  setTheme(saved === 'classic' ? 'classic' : 'noir');
  window.gmMap = map;
})();
</script>
